[workspace]
members = ["crates/tinychannels-bus", "crates/tinychannels-runtime", "crates/tinychannels-module"]
default-members = [".", "crates/tinychannels-bus", "crates/tinychannels-runtime", "crates/tinychannels-module"]
# The bus is a submodule with its own workspace; it is a path dependency of the
# module crate, not a member here.
exclude = ["vendor/tinybus"]
resolver = "3"

[patch.crates-io]
tinybus = { path = "vendor/tinybus/crates/tinybus" }
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module" }

[workspace.package]
# Releases update this sole workspace version before packaging every crate.
version = "0.1.3"

[package]
name = "tinychannels"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "Pluggable channel and messaging primitives for OpenHuman harness communication."
repository = "https://github.com/tinyhumansai/tinychannels"
readme = "README.md"
keywords = ["messaging", "channels", "openhuman", "harness"]
categories = ["asynchronous", "api-bindings"]
# Consumers depend on this crate via GitHub (git dependency / vendored
# submodule), not crates.io, so there is nothing to publish. See the
# equivalent note in crates/tinychannels-bus/Cargo.toml.
publish = false

[features]
default = []
# Retained so downstreams that request it keep resolving; the relay WebSocket
# transport module is still gated on this cfg. `tokio-tungstenite` and
# `tokio/net` are now unconditional dependencies (the ported channel providers
# use them directly), so this feature no longer needs to pull them in.
relay-websocket = []
# SMTP send only (`EmailChannel::new` + `send_message` / `build_*_message`).
#
# Split out of `email` because sending and receiving have very different costs
# and very different consumers. A host that only ever *delivers* mail — OpenHuman
# emails a generated podcast as an attachment and never reads a mailbox — needs
# `lettre` and nothing else. Bundling the two meant that host also linked the
# IMAP receive stack, 13 crates it could never call, and once the channel
# providers move into the `tinychannels` bus module that would have been the
# whole of the shed the move was supposed to buy.
#
# This carries no `Channel` impl: a send-only build cannot `listen`, so
# advertising the trait would promise a half-working channel.
email-send = ["dep:lettre"]
# Full email provider (`providers::email_channel`) — IMAP receive + SMTP send.
# Off by default: it is the single heaviest provider in the crate, pulling the
# lettre/async-imap/mail-parser stack. Downstreams that expose an email channel
# opt in; downstreams that only send want `email-send` above.
email = ["email-send", "dep:async-imap", "dep:mail-parser"]
# Lark/Feishu provider (`providers::lark`) — runs its own axum webhook receiver
# and decodes protobuf events, so it owns both `axum` (5 crates) and `prost`
# (4 crates). Off by default for the same reason.
lark = ["dep:axum", "dep:prost"]
# WhatsApp Web (multi-device) provider — pulls the native whatsapp-rust stack.
# Off by default; the OpenHuman `whatsapp-web` feature forwards to this one.
whatsapp-web = [
    "dep:whatsapp-rust",
    "dep:whatsapp-rust-tokio-transport",
    "dep:whatsapp-rust-ureq-http-client",
    "dep:wacore",
]

[dependencies]
# The transport-free vocabulary shared with every TinyChannels host. The
# provider stack below is the implementation of that contract; a host that
# only names channel types depends on the bus crate alone.
tinychannels-bus = { version = "0.1.3", path = "crates/tinychannels-bus" }
tinychannels-runtime = { version = "0.1.2", path = "crates/tinychannels-runtime" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
hmac = "0.13"
parking_lot = "0.12"
prost = { version = "0.14", optional = true }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1.14.0"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1.0.6"

# Email channel (SMTP + IMAP).
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"], optional = true }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"], optional = true }
mail-parser = { version = "0.11.2", optional = true }

# Lark/Feishu webhook (HTTP receive mode).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }

# WhatsApp Web provider (behind the `whatsapp-web` feature).
serde-big-array = { version = "0.5", optional = true }
whatsapp-rust = { version = "0.6", optional = true, default-features = false, features = ["tokio-runtime"] }
whatsapp-rust-tokio-transport = { version = "0.6", optional = true, default-features = false }
whatsapp-rust-ureq-http-client = { version = "0.6", optional = true }
wacore = { version = "0.6", optional = true, default-features = false }

[dev-dependencies]
# Dual-declared: the optional dependency above belongs to the `lark` provider,
# but `providers/discord/api_tests.rs` spins an axum mock server to test the
# Discord REST client — unrelated to Lark, and it must build with `lark` off.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
tempfile = "3"
toml = "1"
wiremock = "0.6"
