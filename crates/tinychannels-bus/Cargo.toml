[package]
name = "tinychannels-bus"
version.workspace = true
edition = "2024"
# Not published to a package registry. Every consumer takes this repository as
# a git submodule and a path dependency, and the loadable module is delivered as
# a release artifact pinned by its SHA-256 digest rather than a crate.
# `publish = false` makes that a property of the manifest instead of a
# convention someone has to remember, so
# an accidental `cargo publish` fails locally rather than claiming a name on
# crates.io that cannot be taken back.
publish = false
license = "GPL-3.0-only"
description = "TinyBus wire contract for TinyChannels: names, payload types, config and errors."
repository = "https://github.com/tinyhumansai/tinychannels"
readme = "README.md"
keywords = ["messaging", "channels", "tinybus", "openhuman"]
categories = ["data-structures", "api-bindings"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
# Serialization only: preserves PassthroughForward.body's existing Base64 wire encoding.
base64 = "0.23"

[dev-dependencies]
toml = "1"
