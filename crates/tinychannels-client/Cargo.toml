[package]
rust-version = "1.94"
name = "tinychannels-client"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "Typed host calls to the TinyChannels TinyBus module."
repository = "https://github.com/tinyhumansai/tinychannels"
publish = false

[dependencies]
async-trait = "0.1"
tinybus = { workspace = true }
tinychannels-bus = { path = "../tinychannels-bus", features = ["storage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
native-e2e = []

[dev-dependencies]
tinybus = { workspace = true, features = ["macros", "modules"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[[test]]
name = "native_e2e"
path = "tests/native_e2e.rs"
required-features = ["native-e2e"]

[[test]]
name = "runtime_native_e2e"
path = "tests/runtime_native_e2e.rs"
required-features = ["native-e2e"]

[[test]]
name = "runtime_readiness_e2e"
path = "tests/runtime_readiness_e2e.rs"
required-features = ["native-e2e"]

[[test]]
name = "native_module_runtime_e2e"
path = "tests/native_module_runtime_e2e.rs"
required-features = ["native-e2e"]
