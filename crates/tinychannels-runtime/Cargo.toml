[package]
name = "tinychannels-runtime"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "Reusable listener supervision and runtime helpers for TinyChannels."
repository = "https://github.com/tinyhumansai/tinychannels"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
rand = "0.10"
tinychannels-bus = { path = "../tinychannels-bus" }
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Runtime-owned algorithms, serialization helpers and state.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
parking_lot = "0.12"
hex = "0.4"

[dev-dependencies]
toml = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
