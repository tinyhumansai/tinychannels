[graph]
all-features = true

[advisories]
ignore = [
    # The only resolved 0.26 package is the crates.io compatibility shim,
    # whose source re-exports its `parent` dependency. The CI graph guard
    # requires that exact shim source and a crates.io parent >= 1.0.10; it
    # rejects the vulnerable bundled roots and any changed resolution.
    { id = "RUSTSEC-2026-0381", reason = "The resolved 0.26.11 crate is a re-export shim; scripts/check-webpki-roots.py proves its parent is the patched 1.x bundle." },
]

[licenses]
# Licenses accepted for this crate and its dependencies. Keep GPL-3.0-only for
# the template crate itself; the remaining entries cover compatible dependency
# licenses commonly encountered by Rust projects.
allow = [
    # Public CA root data and permissive dependency code licenses.
    "CDLA-Permissive-2.0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # constant_time_eq 0.1.5, via ppt-rs -> zip 0.6.6. A public-domain
    # dedication — strictly more permissive than the rest of this list, and it
    # imposes no obligation on a GPL-3.0-only crate.
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat build times; review them rather than ignoring them.
multiple-versions = "warn"
wildcards = "deny"
# Local unpublished workspace packages are resolved by path, never a registry wildcard.
allow-wildcard-paths = true
# Crates that must never enter the dependency graph.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Storage/voice use canonical revisions; the attested TinyBus SDK is pinned
# to the coordinated migration PR until it lands upstream.
allow-git = [
    "https://github.com/tinyhumansai/tinystoragedrivers",
    "https://github.com/tinyhumansai/tinyvoice",
    "https://github.com/senamakel/tinybus",
]
